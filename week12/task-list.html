<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add & Remove Items</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#182234;font:16px/1.5 Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,600px)}header{margin-bottom:16px}a{color:#2563eb}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:24px;box-shadow:0 8px 24px #1822340d}h2{margin:0 0 16px;font-size:22px}h3{margin:0;font-size:17px}p{margin:12px 0 0}button{font:inherit;background:#2563eb;color:white;padding:10px 16px;border:0;border-radius:7px;cursor:pointer}button:hover:not(:disabled){background:#1e40af}button:disabled{background:#94a3b8;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0f766e;outline-offset:3px}input{font:inherit;padding:11px;min-width:0;border:1px solid #cbd5e1;border-radius:8px;width:100%}.row{display:flex;gap:10px;align-items:center}.row input{flex:1}.details,.task,.player,.total{background:#f1f5f9;border-radius:9px;padding:16px;margin-top:14px;overflow-wrap:anywhere}.tasks{list-style:none;padding:0;margin:0}.task{display:flex;gap:12px;align-items:center;justify-content:space-between}.task span{min-width:0}.remove{background:#fee2e2;color:#991b1b;padding:6px 12px}.remove:hover:not(:disabled){background:#fecaca}.muted{color:#64748b}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{text-align:center;margin:0}.score{font-size:44px;font-weight:bold;color:#2563eb;margin:10px 0;font-variant-numeric:tabular-nums}.controls{display:flex;justify-content:center;gap:10px}.total{display:flex;align-items:center;justify-content:space-between;font-weight:bold}.total strong{font-size:30px;color:#2563eb}@media(max-width:390px){body{padding:12px}.card{padding:16px}.players{grid-template-columns:1fr}}
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head><body><main><header><a href="../index.html#week12">← week12</a></header><div id="root"><p>Loading...</p></div></main>
<script>
const h=React.createElement;
const {useState,useRef}=React;
function TaskList(){
  const [tasks,setTasks]=useState([]);
  const [input,setInput]=useState('');
  const nextId=useRef(1);
  function addTask(event){
    event.preventDefault();
    const value=input.trim();
    if(!value) return;
    const task={id:nextId.current++,text:value};
    setTasks(prev=>[...prev,task]);
    setInput('');
  }
  function removeTask(id){setTasks(prev=>prev.filter(t=>t.id!==id));}
  return h('section',{className:'card'},
    h('form',{className:'row',onSubmit:addTask},
      h('input',{value:input,onChange:e=>setInput(e.target.value),placeholder:'New task','aria-label':'New task'}),
      h('button',{type:'submit',disabled:!input.trim()},'Add')
    ),
    h('p',{className:'muted','aria-live':'polite'},tasks.length+' items'),
    h('ul',{className:'tasks'},tasks.map(task=>h('li',{className:'task',key:task.id},
      h('span',null,task.text),
      h('button',{type:'button',className:'remove',onClick:()=>removeTask(task.id),'aria-label':'Remove '+task.text},'✕')
    )))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(TaskList));
</script></body></html>
