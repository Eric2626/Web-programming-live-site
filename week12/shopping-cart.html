<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Shopping Cart</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#192637;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px 48px}a{color:#2563eb}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;gap:12px}h1{font-size:clamp(24px,4vw,34px);margin:0}h2{font-size:20px;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.product,.cart{background:white;border:1px solid #dce4ee;border-radius:13px;padding:16px}.product img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#fff;padding:10px;border-radius:8px}.product h3{font-size:17px;margin:15px 0 6px}.price{font-size:18px;font-weight:bold;margin:0 0 15px}.product button{width:100%}button{border:0;border-radius:7px;padding:10px 12px;background:#2563eb;color:white;font:inherit;cursor:pointer}button:hover{background:#1d4ed8}button:focus-visible,a:focus-visible{outline:3px solid #0f766e;outline-offset:3px}.cart{position:sticky;top:20px}.cart-header{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:13px;background:#e8efff;color:#1e40af;padding:6px 9px;border-radius:20px;white-space:nowrap}.empty{padding:24px 0;color:#64748b;text-align:center}.cart-item{padding:14px 0;border-top:1px solid #e2e8f0}.item-info{display:flex;align-items:center;gap:12px}.item-info img{width:54px;height:43px;object-fit:contain;border-radius:6px;background:#fff}.item-info h3{font-size:14px;margin:0 0 5px}.item-info p{font-size:13px;margin:0;color:#475569}.item-controls{display:flex;align-items:center;gap:8px;margin-top:10px}.quantity{min-width:22px;text-align:center}.item-controls button{background:#e8eef6;color:#192637;padding:7px 12px}.item-controls button:hover{background:#d5e1f1}.item-controls .remove{margin-left:auto;background:transparent;color:#b42318;font-size:13px;text-decoration:underline}.total{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #dce4ee;margin-top:10px;padding-top:18px;font-size:19px;font-weight:bold}.total span:last-child{text-align:right}@media(max-width:820px){.layout{grid-template-columns:1fr}.cart{position:static}}@media(max-width:420px){.products{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
.buy{width:100%;margin-top:18px;font-weight:bold;padding:13px}.buy:disabled{background:#94a3b8;cursor:not-allowed}.checkout{width:min(440px,calc(100% - 32px));max-height:90vh;overflow:auto;border:1px solid #dce4ee;border-radius:16px;padding:24px;color:#192637;box-shadow:0 20px 60px #0f172a40}.checkout::backdrop{background:#0f172a80}.checkout-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.checkout-head h2{margin:0}.checkout-head button{background:#e8eef6;color:#192637}.demo-note{background:#fff7e6;color:#744410;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}.checkout label{display:block;margin:14px 0 5px;font-size:14px;font-weight:bold}.checkout input{width:100%;font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:7px;color:#192637;background:white}.checkout input:focus{outline:2px solid #2563eb;outline-offset:1px}.payment-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fill-demo{background:#e8eef6;color:#192637;margin:12px 0 0;width:100%}.fill-demo:hover{background:#d5e1f1}.success{color:#166534;background:#dcfce7;padding:12px;border-radius:8px;font-size:14px;margin-top:12px}</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<main>
<header><h1>Shopping Cart</h1><a href="../index.html#week12">← week12</a></header>
<div id="root"><p>Loading shopping cart...</p></div>
<details style="margin-top:24px;color:#64748b;font-size:12px"><summary>Image credits</summary><p>Traditional Mongolian Deel: <a href="https://commons.wikimedia.org/wiki/File:Mongolian_clothing_(deel).jpg" target="_blank" rel="noopener noreferrer">smartneddy, Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a></p></details>
</main>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;
// Product photo URLs; local SVG data URLs are used if an external photo fails.
// Deel photo: smartneddy, CC BY-SA 3.0, Wikimedia Commons.
function imageURL(drawing){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#f4f7fb"/>' + drawing + '</svg>'
  );
}
const products = [
  {id:1,name:"Sony PlayStation 5 Slim (1TB Disc Edition)",price:700000,image:"https://www.jib.co.th/img_master/product/original/2026011408550082892_2.png",fallback:imageURL('<rect x="140" y="24" width="40" height="132" rx="8" fill="#152236"/><path d="M127 20 Q117 76 128 158 L145 153 L145 25Z" fill="#dbe3ef" stroke="#a3b3c8"/><path d="M176 24 L193 20 Q203 76 192 158 L176 153Z" fill="#fff" stroke="#a3b3c8"/><ellipse cx="160" cy="158" rx="43" ry="5" fill="#9aabc0"/><path d="M146 40 V83" stroke="#2563eb" stroke-width="3"/>')},
  {id:2,name:"NVIDIA GeForce RTX 5090 Founders Edition (32GB)",price:3500000,image:"https://sota.store/image/cache/catalog/IP/nvidia-geforce_900-1g144-2530-000-1600x1600.webp",fallback:imageURL('<rect x="48" y="53" width="224" height="74" rx="10" fill="#243345" stroke="#697b90" stroke-width="4"/><rect x="92" y="127" width="80" height="6" fill="#b69245"/><g fill="#111827" stroke="#9aabc0" stroke-width="2"><circle cx="90" cy="90" r="28"/><circle cx="160" cy="90" r="28"/><circle cx="230" cy="90" r="28"/></g><g fill="#64748b"><circle cx="90" cy="90" r="13"/><circle cx="160" cy="90" r="13"/><circle cx="230" cy="90" r="13"/></g>')},
  {id:3,name:"Traditional Mongolian Deel",price:250000,image:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Mongolian_clothing_%28deel%29.jpg/330px-Mongolian_clothing_%28deel%29.jpg?utm_campaign=index&utm_content=thumbnail&utm_source=commons.wikimedia.org",alternateImage:"https://upload.wikimedia.org/wikipedia/commons/b/bf/Mongolian_clothing_%28deel%29.jpg?utm_campaign=index&utm_content=original&utm_source=commons.wikimedia.org",fallback:imageURL('<path d="M139 23 L113 33 L77 89 L104 104 L124 76 L117 154 H203 L196 76 L216 104 L243 89 L207 33 L181 23Z" fill="#184c8d" stroke="#133660" stroke-width="3"/><path d="M139 23 L158 45 L181 23 M158 45 L183 68 L183 154" fill="none" stroke="#d8aa56" stroke-width="5"/><rect x="117" y="89" width="86" height="10" rx="3" fill="#d8aa56"/>')},
  {id:4,name:"Samsung Odyssey G5 G55C (27-inch QHD, 165Hz)",price:320000,image:"https://images.samsung.com/is/image/samsung/p6pim/us/ls27cg552enxza/gallery/us-odyssey-g5-g55c-ls27cg552enxza-550332449?$product-details-jpg$",fallback:imageURL('<rect x="65" y="27" width="190" height="111" rx="7" fill="#1c293b"/><rect x="72" y="34" width="176" height="96" rx="3" fill="#315d94"/><path d="M72 111 L120 66 L151 98 L185 49 L248 98 V130 H72Z" fill="#74a0d4"/><rect x="151" y="138" width="18" height="18" fill="#46566b"/><rect x="125" y="156" width="70" height="5" rx="2" fill="#46566b"/>')},
  {id:5,name:"Logitech G PRO X Wired Gaming Headset",price:89000,image:"https://resource.logitechg.com/w_544,h_466,ar_7:6,c_pad,q_auto,f_auto,dpr_1.0/d_transparent.gif/content/dam/gaming/en/products/pro-x/pro-headset-gallery-1.png",fallback:imageURL('<path d="M103 100 V76 A57 57 0 0 1 217 76 V100" fill="none" stroke="#26364a" stroke-width="16"/><rect x="86" y="80" width="40" height="63" rx="15" fill="#26364a"/><rect x="194" y="80" width="40" height="63" rx="15" fill="#26364a"/><path d="M211 136 Q209 159 173 159" fill="none" stroke="#334155" stroke-width="6"/><rect x="159" y="154" width="24" height="10" rx="5" fill="#2563eb"/>')}
];
const money = value => value.toLocaleString('ko-KR') + '원';
function ProductCard({product,onAdd}){
  return h('article',{className:'product'},
    h('img',{src:product.image,alt:product.name,referrerPolicy:'no-referrer',onError:e=>{const img=e.currentTarget;if(product.alternateImage&&!img.dataset.retried){img.dataset.retried='1';img.src=product.alternateImage;}else if(img.src!==product.fallback){img.src=product.fallback;}}}),
    h('h3',null,product.name),
    h('p',{className:'price'},money(product.price)),
    h('button',{onClick:()=>onAdd(product)},'Add to Cart')
  );
}
// Educational checkout: only these synthetic test values are accepted.
const testCard = {name:'DEMO USER',number:'4242 4242 4242 4242',expiry:'12/30',cvc:'123'};
function Checkout({total,onClose,onSuccess}){
  const dialog = useRef(null);
  const [card,setCard] = useState({name:'',number:'',expiry:'',cvc:''});
  useEffect(()=>{
    if(dialog.current && !dialog.current.open) dialog.current.showModal();
  },[]);
  const ready = Object.keys(testCard).every(key=>card[key]===testCard[key]);
  function field(key,label){
    return h('div',{key},
      h('label',{htmlFor:'demo-'+key},label),
      h('input',{id:'demo-'+key,type:'text',autoComplete:'off',spellCheck:false,placeholder:testCard[key],
        inputMode:key==='name'?'text':'numeric',maxLength:testCard[key].length,value:card[key],
        onChange:e=>{
          let value=e.target.value;
          if(key==='name') value=value.toUpperCase();
          if(key==='number'){value=value.replace(/[^0-9]/g,'').slice(0,16).replace(/(.{4})(?=.)/g,'$1 ');}
          if(key==='expiry'){value=value.replace(/[^0-9]/g,'').slice(0,4).replace(/^(..)(?=.)/,'$1/');}
          if(testCard[key].startsWith(value)) setCard(prev=>({...prev,[key]:value}));
        }})
    );
  }
  return h('dialog',{ref:dialog,className:'checkout','aria-labelledby':'checkout-title',onCancel:e=>{e.preventDefault();onClose();}},
    h('div',{className:'checkout-head'},h('h2',{id:'checkout-title'},'Card Payment'),h('button',{type:'button',onClick:onClose,'aria-label':'Close checkout'},'×')),
    h('p',{className:'demo-note'},'Demo checkout only. Use the test card below. Never enter real card details. No payment is processed or information sent.'),
    h('form',{autoComplete:'off',onSubmit:e=>{e.preventDefault();if(ready)onSuccess();}},
      field('name','Cardholder Name'),field('number','Card Number'),
      h('div',{className:'payment-row'},field('expiry','Expiry Date (MM/YY)'),field('cvc','CVV')),
      h('button',{className:'fill-demo',type:'button',onClick:()=>setCard({...testCard})},'Use Test Card'),
      h('div',{className:'total'},h('span',null,'Total'),h('span',null,money(total))),
      h('button',{className:'buy',type:'submit',disabled:!ready},'Pay (Demo)')
    )
  );
}
function ShoppingCart(){
  const [cart,setCart] = useState([]);
  const [checkout,setCheckout] = useState(false);
  const [orderComplete,setOrderComplete] = useState(false);
  function completeOrder(){setCheckout(false);setCart([]);setOrderComplete(true);}
  function add(product){
    setOrderComplete(false);
    setCart(prev => prev.some(item=>item.id===product.id)
      ? prev.map(item=>item.id===product.id?{...item,quantity:item.quantity+1}:item)
      : [...prev,{...product,quantity:1}]);
  }
  function changeQuantity(id,delta){
    setCart(prev=>prev.map(item=>item.id===id?{...item,quantity:item.quantity+delta}:item)
      .filter(item=>item.quantity>0));
  }
  function remove(id){
    setCart(prev=>prev.filter(item=>item.id!==id));
  }
  const total = cart.reduce((sum,item)=>sum+item.price*item.quantity,0);
  const count = cart.reduce((sum,item)=>sum+item.quantity,0);
  return h('div',{className:'layout'},
    h('section',{'aria-label':'Product list'},
      h('h2',null,'Products'),
      h('div',{className:'products'},products.map(product=>h(ProductCard,{key:product.id,product,onAdd:add})))
    ),
    h('aside',{className:'cart','aria-label':'Shopping cart'},
      h('div',{className:'cart-header'},h('h2',null,'Your Cart'),h('span',{className:'badge','aria-live':'polite'},count+' items')),
      cart.length===0?h('p',{className:'empty'},'Your cart is empty.'):cart.map(item=>
        h('article',{className:'cart-item',key:item.id},
          h('div',{className:'item-info'},h('img',{src:item.image,alt:'',referrerPolicy:'no-referrer',onError:e=>{const img=e.currentTarget;if(item.alternateImage&&!img.dataset.retried){img.dataset.retried='1';img.src=item.alternateImage;}else if(img.src!==item.fallback){img.src=item.fallback;}}}),h('div',null,h('h3',null,item.name),h('p',null,money(item.price*item.quantity)))),
          h('div',{className:'item-controls'},
            h('button',{onClick:()=>changeQuantity(item.id,-1),'aria-label':'Decrease '+item.name},'−'),
            h('span',{className:'quantity'},item.quantity),
            h('button',{onClick:()=>changeQuantity(item.id,1),'aria-label':'Increase '+item.name},'+'),
            h('button',{className:'remove',onClick:()=>remove(item.id),'aria-label':'Remove '+item.name},'Remove')
          )
        )
      ),
      h('div',{className:'total','aria-live':'polite'},h('span',null,'Total'),h('span',null,money(total))),
      h('button',{className:'buy',disabled:cart.length===0,onClick:()=>setCheckout(true)},'Buy'),
      orderComplete?h('p',{className:'success',role:'status'},'Demo payment successful! Thank you for your order.'):null
    ),
    checkout?h(Checkout,{total,onClose:()=>setCheckout(false),onSuccess:completeOrder}):null
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(ShoppingCart));
</script>
</body>
</html>
