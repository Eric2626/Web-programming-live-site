<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fix Me!</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0fdf4;
    }

    h1 {
      color: #15803d;
      font-size: 2rem;
      text-align: center;
    }

    p {
      line-height: 1.7;
      color: #334155;  /* fixed property name */
    }

    /* This is a fixed comment */
    .highlight {
      background-color: #dcfce7;
    }
  </style>
</head>
<body>
  <h1>Fix Me!</h1>
  <p>This paragraph has <span class="highlight">broken CSS</span> around it.</p>
</body>
</html>
