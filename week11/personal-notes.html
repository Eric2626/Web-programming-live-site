<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal Notes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#222;font:16px/1.5 Arial,sans-serif;min-height:100vh;padding:24px;display:grid;place-items:center}main{width:min(100%,700px);margin:auto}header{margin-bottom:14px}a{color:#2563eb}h1{color:#2563eb;font-size:27px;margin:0 0 20px;text-align:center}.card{background:white;padding:24px;border:1px solid #ddd;border-radius:8px}label{display:block;font-weight:bold;margin-bottom:6px}input:not([type=radio]),textarea{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:12px;color:inherit}textarea{resize:vertical;min-height:200px}button{font:inherit;background:#2563eb;border:0;color:white;padding:10px 16px;border-radius:6px;cursor:pointer}button:hover:not(:disabled){background:#1d4ed8}button:disabled{background:#94a3b8;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #2563eb;outline-offset:3px}.field{margin-bottom:16px}.panel{background:#f0f4f8;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-top:18px}.panel h2{margin:0;color:#2563eb;font-size:23px}.muted{color:#64748b}.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px}.error{color:#b91c1c;font-size:14px;margin:5px 0 0}.success{color:#166534;background:#dcfce7;padding:12px;border-radius:6px}.question{border:1px solid #ddd;border-radius:8px;margin:16px 0;padding:15px;min-width:0}legend{font-weight:bold;padding:0 6px}.option{display:flex;align-items:center;gap:10px;padding:9px;border-radius:5px;font-weight:normal;margin:4px 0;background:#f5f7fb;cursor:pointer}.option input{accent-color:#2563eb;flex-shrink:0}.feedback{margin:12px 0 0;color:#166534}.wrong{color:#b91c1c}.score{font-weight:bold;color:#2563eb}p{overflow-wrap:anywhere}@media(max-width:480px){body{padding:16px}.card{padding:16px}}.note-buttons{display:flex;gap:8px}.secondary{background:#e2e8f0;color:#334155}.secondary:hover:not(:disabled){background:#cbd5e1}.saved-notes{margin-top:24px;border-top:1px solid #e2e8f0;padding-top:16px}.saved-notes h2{font-size:20px;color:#2563eb;margin:0 0 12px}.notes-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}.note-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#f1f5f9;border-radius:8px;padding:12px}.note-item p{white-space:pre-wrap;min-width:0;margin:0}.delete{background:#fee2e2;color:#991b1b;font-size:14px;padding:7px 10px;flex-shrink:0}.delete:hover:not(:disabled){background:#fecaca}.actions{flex-wrap:wrap}</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script></head>
<body><main><header><a href="../index.html#week11">← Week 11</a></header><h1>Personal Notes</h1><div id="root"></div></main>
<script>
const h=React.createElement;
const {useState,useEffect}=React;
const draftKey='eric-week11-personal-notes';
const listKey='eric-week11-saved-notes';
function readDraft(){try{return localStorage.getItem(draftKey)||'';}catch{return '';}}
function readNotes(){try{const data=JSON.parse(localStorage.getItem(listKey)||'[]');return Array.isArray(data)?data.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string'):[];}catch{return [];}}
function PersonalNotes(){
  const [note,setNote]=useState(readDraft);
  const [notes,setNotes]=useState(readNotes);
  const [status,setStatus]=useState('');
  useEffect(()=>{
    try{if(note)localStorage.setItem(draftKey,note);else localStorage.removeItem(draftKey);}
    catch{setStatus('Browser storage is unavailable.');}
  },[note]);
  function save(){
    if(!note.trim())return;
    const item={id:String(Date.now())+'-'+Math.random().toString(36).slice(2),text:note.trim()};
    const next=[item,...notes];
    try{localStorage.setItem(listKey,JSON.stringify(next));setNotes(next);setNote('');setStatus('Note saved.');}
    catch{setStatus('Could not save. Your draft is still here.');}
  }
  function remove(id){
    const next=notes.filter(n=>n.id!==id);
    try{localStorage.setItem(listKey,JSON.stringify(next));setNotes(next);setStatus('Note deleted.');}
    catch{setStatus('Could not delete the note.');}
  }
  return h('section',{className:'card'},
    h('label',{htmlFor:'note'},'New note'),
    h('textarea',{id:'note',value:note,onChange:e=>{setNote(e.target.value);setStatus('');},placeholder:'Write your note here...'}),
    h('div',{className:'actions'},h('span',{className:'muted',role:'status'},status),h('div',{className:'note-buttons'},
      h('button',{type:'button',className:'secondary',disabled:!note,onClick:()=>{setNote('');setStatus('Draft cleared.');}},'Clear'),
      h('button',{type:'button',disabled:!note.trim(),onClick:save},'Save Note'))),
    h('section',{className:'saved-notes','aria-labelledby':'saved-title'},
      h('h2',{id:'saved-title'},'Saved Notes ('+notes.length+')'),
      notes.length?h('ul',{className:'notes-list'},notes.map(item=>h('li',{key:item.id,className:'note-item'},
        h('p',null,item.text),h('button',{type:'button',className:'delete',onClick:()=>remove(item.id),'aria-label':'Delete note: '+item.text.slice(0,30)},'Delete')))):
      h('p',{className:'muted'},'No saved notes yet.'))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(PersonalNotes));
</script></body></html>
