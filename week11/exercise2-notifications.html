<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2 - Notification List</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #222;
    }
    main {
      width: 100%;
      max-width: 620px;
      margin: auto;
      text-align: center;
    }
    h1 { color: #2563eb; }
    #root { width: 100%; display: flex; justify-content: center; }
    #root > * { max-width: 100%; text-align: left; }
    @media (max-width: 480px) { body { padding: 16px; } }
    a { color: #2563eb; }
    li { background: white; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
    ul { width: 100%; max-width: 550px; padding-left: 20px; text-align: left; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <main>
  <p><a href="index.html">Back to Week 11</a></p>
  <h1>Exercise 2 - Notification List</h1>
  <div id="root"></div>
  </main>

  <script type="text/babel">
    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Password expires in 3 days' },
      { id: 3, type: 'info', message: 'New lecture materials available' }
    ];

    // Different notification types show different icons.
    function NotificationItem({ type, message }) {
      const icon = type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
      return <li>{icon} {message}</li>;
    }

    function NotificationList() {
      return (
        <ul>
          {notifications.map(n => (
            <NotificationItem key={n.id} type={n.type} message={n.message} />
          ))}
        </ul>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NotificationList />);
  </script>
</body>
</html>
