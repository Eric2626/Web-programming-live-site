<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2 - Notification List</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f7fb; }
    h1 { color: #2563eb; }
    a { color: #2563eb; }
    li { background: white; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
    ul { max-width: 550px; padding-left: 20px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <p><a href="index.html">Back to Week 11</a></p>
  <h1>Exercise 2 - Notification List</h1>
  <div id="root"></div>

  <script type="text/babel">
    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Password expires in 3 days' },
      { id: 3, type: 'info', message: 'New lecture materials available' }
    ];

    // Different notification types show different icons.
    function NotificationItem({ type, message }) {
      const icon = type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
      return <li>{icon} {message}</li>;
    }

    function NotificationList() {
      return (
        <ul>
          {notifications.map(n => (
            <NotificationItem key={n.id} type={n.type} message={n.message} />
          ))}
        </ul>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NotificationList />);
  </script>
</body>
</html>
