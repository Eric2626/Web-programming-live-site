<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 3 - Reusable Card</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f7fb; }
    h1 { color: #2563eb; }
    a { color: #2563eb; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <p><a href="index.html">Back to Week 11</a></p>
  <h1>Exercise 3 - Reusable Card</h1>
  <div id="root"></div>

  <script type="text/babel">
    // This component can show different content using children.
    function Card({ title, children }) {
      return (
        <div style={{
          border: '1px solid #bae6fd',
          borderRadius: 10,
          padding: '16px 20px',
          marginBottom: 16,
          background: 'white',
          maxWidth: 500
        }}>
          <h3 style={{ marginBottom: 10 }}>{title}</h3>
          {children}
        </div>
      );
    }

    function App() {
      return (
        <div>
          <Card title="Lecture Topics">
            <ul>
              <li>Components</li>
              <li>Props</li>
            </ul>
          </Card>

          <Card title="Homework">
            <p>Build a student portfolio component</p>
          </Card>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
