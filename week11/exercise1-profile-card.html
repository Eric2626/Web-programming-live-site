<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 - ProfileCard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f5f7fb; }
    h1 { color: #2563eb; }
    a { color: #2563eb; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <p><a href="index.html">Back to Week 11</a></p>
  <h1>Exercise 1 - ProfileCard</h1>
  <div id="root"></div>

  <script type="text/babel">
    // ProfileCard receives data using props.
    function ProfileCard({
      name,
      role,
      email,
      avatarUrl = 'https://placehold.co/80x80?text=Photo'
    }) {
      return (
        <div style={{
          border: '1px solid #ccc',
          borderRadius: 8,
          padding: 16,
          maxWidth: 300,
          background: 'white'
        }}>
          <img
            src={avatarUrl}
            alt={name}
            style={{ borderRadius: '50%', width: 80, height: 80 }}
          />
          <h2>{name}</h2>
          <p>{role}</p>
          <a href={'mailto:' + email}>{email}</a>
        </div>
      );
    }

    function App() {
      return (
        <ProfileCard
          name="Eric"
          role="Computer Science Student"
          email="eric@example.com"
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
