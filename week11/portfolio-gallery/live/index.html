<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eric's Portfolio Gallery React homework">
  <title>Portfolio Gallery</title>
  <style>
:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #1d3150;
  background: #f4f7fc;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; }
button, a { font: inherit; }
a { color: #265db2; }

.page {
  max-width: 1040px;
  min-height: 100vh;
  margin: auto;
  padding: 38px 22px 70px;
}
.gallery-header { text-align: center; margin-bottom: 26px; }
.back-link { display: inline-block; margin-bottom: 28px; text-decoration: none; font-size: 14px; }
.back-link:hover { text-decoration: underline; }
h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 42px); color: #20477e; }
.gallery-header p { margin: 0; color: #657993; line-height: 1.6; }
.filter-bar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin: 0 auto 19px;
}
.filter-button {
  cursor: pointer;
  padding: 9px 15px;
  border: 1px solid #c8d6eb;
  border-radius: 8px;
  color: #385477;
  background: #fff;
  transition: background-color .18s, border-color .18s;
}
.filter-button:hover, .filter-button:focus-visible { background: #eaf2ff; border-color: #7b9dd6; }
.filter-button.active { background: #2563c4; color: white; border-color: #2563c4; }
.result-count { text-align: center; margin: 0 0 17px; font-size: 14px; color: #6d7f99; }
.project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.project-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 275px;
  padding: 24px;
  background: white;
  border: 1px solid #d7e2f1;
  border-radius: 13px;
  box-shadow: 0 4px 12px rgba(35, 72, 120, .04);
  transition: border-color .18s, box-shadow .18s;
}
.project-card:hover { border-color: #a3bce1; box-shadow: 0 6px 16px rgba(35,72,120,.08); }
.project-card h2 { margin: 0 0 12px; font-size: 22px; line-height: 1.3; }
.project-card p { color: #596c86; line-height: 1.6; margin: 0 0 16px; }
.tech-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 19px; }
.tech-tag { font-size: 12px; padding: 6px 9px; background: #edf4ff; color: #285d9e; border-radius: 6px; }
.project-links { display: flex; flex-wrap: wrap; gap: 9px; }
.project-links a {
  text-decoration: none;
  display: inline-block;
  padding: 10px 13px;
  background: #2863bf;
  color: white;
  border-radius: 7px;
  font-weight: 600;
  font-size: 13px;
}
.project-links a:last-child { background: #11876a; }
.project-links a:hover { filter: brightness(.92); }
.empty-message { text-align: center; padding: 25px; }
footer { text-align: center; margin-top: 36px; font-size: 12px; color: #8593a7; }
@media (max-width: 670px) {
  .page { padding: 26px 16px 50px; }
  .project-grid { grid-template-columns: 1fr; }
  .project-card { min-height: 0; padding: 20px; }
}

  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState } = React;

// Projects I have made for Web Programming.
const base = 'https://eric2626.github.io/Web-programming-live-site/';
const github = 'https://github.com/Eric2626/Web-programming-live-site/';

const projects = [
  {
    id: 1,
    title: 'Memory Match — Neon Arcade',
    description: 'A memory card game made with my team. Players can practice and try timed challenges.',
    techStack: ['HTML', 'CSS', 'JavaScript'],
    githubUrl: github + 'tree/main/teamproject',
    demoUrl: base + 'teamproject/index.html',
  },
  {
    id: 2,
    title: 'Book Search',
    description: 'A book search page that shows matching books using a book data API.',
    techStack: ['HTML', 'CSS', 'JavaScript'],
    githubUrl: github + 'blob/main/week7/book-search.html',
    demoUrl: base + 'week7/book-search.html',
  },
  {
    id: 3,
    title: 'Student Registration Form',
    description: 'An upgraded student registration form with clear input fields and form checks.',
    techStack: ['HTML', 'CSS', 'JavaScript'],
    githubUrl: github + 'blob/main/week8/upgraded%20registration.html',
    demoUrl: base + 'week8/upgraded%20registration.html',
  },
  {
    id: 4,
    title: 'Student Directory',
    description: 'A React page that displays three student cards with props and their course information.',
    techStack: ['React', 'CSS', 'JavaScript'],
    githubUrl: github + 'tree/main/week11/task11',
    demoUrl: base + 'week11/task11/live/',
  },
];

function FilterBar({ technologies, selectedTechnology, onChange }) {
  return (
    <nav className="filter-bar" aria-label="Filter projects by technology">
      {technologies.map((technology) => (
        <button
          type="button"
          key={technology}
          className={selectedTechnology === technology ? 'filter-button active' : 'filter-button'}
          aria-pressed={selectedTechnology === technology}
          onClick={() => onChange(technology)}
        >
          {technology}
        </button>
      ))}
    </nav>
  );
}

function ProjectCard({ project }) {
  return (
    <article className="project-card">
      <div className="project-card-top">
        <h2>{project.title}</h2>
        <p>{project.description}</p>
      </div>
      <div className="tech-list" aria-label="Technologies used">
        {project.techStack.map((technology) => (
          <span className="tech-tag" key={technology}>{technology}</span>
        ))}
      </div>
      <div className="project-links">
        <a href={project.githubUrl} target="_blank" rel="noopener noreferrer">GitHub Code ↗</a>
        <a href={project.demoUrl} target="_blank" rel="noopener noreferrer">Live Demo ↗</a>
      </div>
    </article>
  );
}

function ProjectList({ projects }) {
  if (projects.length === 0) {
    return <p className="empty-message">No projects found for this technology.</p>;
  }

  return (
    <section className="project-grid" aria-label="Portfolio projects">
      {projects.map((project) => (
        <ProjectCard key={project.id} project={project} />
      ))}
    </section>
  );
}

const technologies = ['All', ...new Set(projects.flatMap((project) => project.techStack))];

function App() {
  const [selectedTechnology, setSelectedTechnology] = useState('All');

  const visibleProjects = projects.filter((project) => (
    selectedTechnology === 'All' || project.techStack.includes(selectedTechnology)
  ));

  return (
    <main className="page">
      <div className="gallery-header">
        <a className="back-link" href="../../index.html">← Week 11</a>
        <h1>Portfolio Gallery</h1>
        <p>My Web Programming projects. Select a technology to filter the cards.</p>
      </div>

      <FilterBar
        technologies={technologies}
        selectedTechnology={selectedTechnology}
        onChange={setSelectedTechnology}
      />

      <p className="result-count" aria-live="polite">
        Showing {visibleProjects.length} {visibleProjects.length === 1 ? 'project' : 'projects'}
      </p>
      <ProjectList projects={visibleProjects} />
      <footer>Eric · Web Programming · Week 11</footer>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
