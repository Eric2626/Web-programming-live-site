<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric's Homework</title>

  <style>body{font-family:Arial,sans-serif;background-color:#f0f4f8;color:#222;margin:0;padding:20px;}.container{max-width:1000px;margin:auto;}h1{color:#2563eb;}.weeks{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0;}button{background-color:#2563eb;color:white;border:none;border-radius:6px;padding:10px 15px;cursor:pointer;}button:hover{background-color:#1e40af;}.site-link{display:inline-block;margin-left:10px;padding:10px 15px;border-radius:6px;background-color:#10b981;color:white;font-size:13.3333px;text-decoration:none;vertical-align:middle;}.site-link:hover,.site-link:focus-visible{background-color:#047857;}button:disabled{background-color:#94a3b8;cursor:default;}.active{background-color:#163274;}.card{background-color:white;border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:15px;}.card h3,#homeworkTitle{overflow-wrap:anywhere;}#viewer{display:none;background-color:white;border-radius:10px;padding:20px;margin-top:25px;}#preview{display:none;box-sizing:border-box;width:100%;height:650px;border:1px solid #ddd;margin-top:15px;background-color:white;}#codeBox{display:none;}pre{background-color:#182234;color:white;padding:15px;overflow:auto;max-height:550px;line-height:1.6;border-radius:6px;}#message{color:#555;}</style>
</head>

<body>
  <div class="container">
    <h1>Eric's Homework</h1>
    <p>My Web Programming Assignments</p>

    <section class="card" id="team-project" aria-labelledby="team-project-title">
      <h2 id="team-project-title">Team project: Memory Match</h2>
      <p>A shared browser game by Sudip, Sondor, Eric and Abinash, with timed challenges, practice and local two-player duel.</p>
      <nav aria-label="Memory Match project materials" style="display:flex;flex-wrap:wrap;gap:10px">
        <a class="site-link" style="margin-left:0" href="teamproject/index.html">Play Memory Match</a>
        <a class="site-link" style="margin-left:0" href="teamproject/presentation.html">Presentation</a>
        <a class="site-link" style="margin-left:0" href="teamproject/report.html">Project report</a>
        <a class="site-link" style="margin-left:0" href="teamproject/submission.html">Submission guide</a>
      </nav>
    </section>

    <div id="weeks" class="weeks"></div>

    <h2 id="weekTitle">Week 2</h2>
    <div id="homeworkList"></div>

    <div id="viewer">
      <h2 id="homeworkTitle"></h2>

      <button onclick="closeViewer()">Close</button>

      <p id="message" role="status"></p>

      <div id="codeBox">
        <button
          id="previewCodeButton"
          onclick="previewCode()"
          disabled>
          Preview
        </button>

        <pre><code id="codeText"></code></pre>
      </div>

      <iframe
        id="preview"
        title="Homework preview"
        sandbox="allow-scripts allow-forms allow-modals">
      </iframe>
    </div>
  </div>

  <script src="homework-performance.js?v=1" defer></script>
</body>
</html>
