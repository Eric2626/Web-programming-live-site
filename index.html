<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric's Homework</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #2563eb;
    }

    .weeks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 25px 0;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }

    .site-link {
      display: inline-block;
      margin-left: 10px;
      padding: 10px 15px;
      border-radius: 6px;
      background-color: #10b981;
      color: white;
      font-size: 13.3333px;
      text-decoration: none;
      vertical-align: middle;
    }

    .site-link:hover,
    .site-link:focus-visible {
      background-color: #047857;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: default;
    }

    .active {
      background-color: #163274;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h3,
    #homeworkTitle {
      overflow-wrap: anywhere;
    }

    #viewer {
      display: none;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 25px;
    }

    #preview {
      display: none;
      box-sizing: border-box;
      width: 100%;
      height: 650px;
      border: 1px solid #ddd;
      margin-top: 15px;
      background-color: white;
    }

    #codeBox {
      display: none;
    }

    pre {
      background-color: #182234;
      color: white;
      padding: 15px;
      overflow: auto;
      max-height: 550px;
      line-height: 1.6;
      border-radius: 6px;
    }

    #message {
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Eric's Homework</h1>
    <p>My Web Programming Assignments</p>

    <section class="card" id="team-project" aria-labelledby="team-project-title">
      <h2 id="team-project-title">Team project: Memory Match</h2>
      <p>A shared browser game by Sudip, Sondor, Eric and Abinash, with timed challenges, practice and local two-player duel.</p>
      <nav aria-label="Memory Match project materials" style="display:flex;flex-wrap:wrap;gap:10px">
        <a class="site-link" style="margin-left:0" href="teamproject/index.html">Play Memory Match</a>
        <a class="site-link" style="margin-left:0" href="teamproject/presentation.html">Presentation</a>
        <a class="site-link" style="margin-left:0" href="teamproject/report.html">Project report</a>
        <a class="site-link" style="margin-left:0" href="teamproject/submission.html">Submission guide</a>
      </nav>
    </section>

    <div id="weeks" class="weeks"></div>

    <h2 id="weekTitle">Week 2</h2>
    <div id="homeworkList"></div>

    <div id="viewer">
      <h2 id="homeworkTitle"></h2>

      <button onclick="closeViewer()">Close</button>

      <p id="message" role="status"></p>

      <div id="codeBox">
        <button
          id="previewCodeButton"
          onclick="previewCode()"
          disabled>
          Preview
        </button>

        <pre><code id="codeText"></code></pre>
      </div>

      <iframe
        id="preview"
        title="Homework preview"
        sandbox="allow-scripts allow-forms allow-modals">
      </iframe>
    </div>
  </div>

  <script>
    var githubURL =
      "https://raw.githubusercontent.com/Eric2626/web-programming/main/";

    var homework = [];

    for (var i = 1; i <= 10; i++) {
      homework[i] = [];
    }

    homework[2] = [
      "week2/Task1 Convert dip soup into semanting HTML.html",
      "week2/Task2_Blog artice with header &amp;footer.html",
      "week2/Task3_Figure, figcaption&amp;time.html",
      "week2/Task4_FAQ with details & summary.html",
      "week2/Task5_Full Semantic Portfolio Page.html",
      "week2/Task6_Fix semantic errors.html",
      "week2/Task7_Quatation and amp citation page .html",
      "week2/Task8_News Article — All Semantic Elements.html"
    ];

    homework[3] = [
      "week3/Task1_style your first heading.html",
      "week3/Task2_2.html",
      "week3/Task3_Color Palette Card.html",
      "week3/Task4_Box Model Visualisation.html",
      "week3/Task5_Fix the broken CSS.html",
      "week3/Task6_Flexbox  Navigation Bar.html",
      "week3/Task7_Profile card with CSS.html",
      "week3/Task8_Full style sheet.html",
      "week3_1/Task_01_Position_the_Badge.html",
      "week3_1/Task_02_Hover_Card_with_Transition.html",
      "week3_1/Task_03_Loading_Spinner_with_keyframes.html",
      "week3_1/Task_04_CSS_Variables_Theme.html",
      "week3_1/Task_05_Fixed_Navigation_Bar.html",
      "week3_1/Task_06_Responsive_Grid_Page.html",
      "week3_1/Task_07_Complete_CSS_Advanced_Portfolio_Page.html"
    ];

    homework[4] = [
      "week4/task1_click_counter.html",
      "week4/task2_dark_mode_toggle.html",
      "week4/task3_interactive_todo_list.html",
      "week4/task4_live_search_filter.html"
    ];

    // Week 5: JavaScript Basics and Counter.
    homework[5] = [
      "week5/js-basics.html",
      "week5/counter.html"
    ];

    // Week 6: match the lowercase week6 folder and existing filenames.
    homework[6] = [
      "week6/random-joke.html",
      "week6/jsonplaceholder.html",
      "week6/open-meteo.html",
      "week6/random-user.html",
      "week6/pokeapi.html",
      "week6/rest-countries.html"
    ];

    // Week 7: original Book Search plus the HTML Forms practice and homework.
    homework[7] = [
      "week7/book-search.html",
      "week7/login.html",
      "week7/validation.html",
      "week7/css_states.html",
      "week7/homework.html"
    ];

    // Week 8: actual filename as uploaded to the week8 GitHub folder.
    homework[8] = [
      "week8/upgraded registration.html"
    ];

    var currentWeek = 2;
    var currentFile = "";
    var viewNumber = 0;

    // Create Week 1–10 buttons.
    for (var week = 1; week <= 10; week++) {
      var button = document.createElement("button");

      button.textContent = "Week " + week;
      button.value = week;

      button.onclick = function () {
        var selected = Number(this.value);
        showWeek(selected);
        window.history.replaceState(null, "", "#week" + selected);
      };

      document.getElementById("weeks").appendChild(button);
    }

    function getTitle(file) {
      var labels = {
        "week5/js-basics.html": "Task 1 – JavaScript Basics",
        "week5/counter.html": "Task 2 – Counter",
        "week6/random-joke.html": "Task 1 – Random Joke Fetcher",
        "week6/jsonplaceholder.html": "Task 2 – JSONPlaceholder",
        "week6/open-meteo.html": "Task 3 – Open-Meteo Weather",
        "week6/random-user.html": "Task 4 – Random User",
        "week6/pokeapi.html": "Task 5 – PokéAPI",
        "week6/rest-countries.html": "Task 6 – REST Countries",
        "week7/book-search.html": "Task 1 – Book Search",
        "week7/login.html": "Practice E1 – Login Form",
        "week7/validation.html": "Practice E2 – HTML5 Validation",
        "week7/css_states.html": "Practice E3 – CSS Valid / Invalid States",
        "week7/homework.html": "Homework – Student Registration",
        "week8/upgraded registration.html": "Homework – Upgraded Student Registration"
      };
      if (labels[file]) return labels[file];
      var parts = file.split("/");
      var title = parts[parts.length - 1];
      title = title.replace(/\.html$/i, "").replace(/_/g, " ").replace(/&amp;/g, "&");
      return title.replace(/^task/i, "Task");
    }

    function getFileURL(file) {
      // Convert text such as "&amp;" to the real character "&".
      file = file.replace(/&amp;/g, "&");
      var parts = file.split("/");

      for (var i = 0; i < parts.length; i++) {
        parts[i] = encodeURIComponent(parts[i]);
      }

      return parts.join("/");
    }

    function showWeek(week) {
      currentWeek = week;
      closeViewer();

      document.getElementById("weekTitle").textContent =
        "Week " + week;

      var list = document.getElementById("homeworkList");
      list.innerHTML = "";

      var weekButtons =
        document.getElementById("weeks").children;

      for (var i = 0; i < weekButtons.length; i++) {
        weekButtons[i].className = "";

        if (Number(weekButtons[i].value) === week) {
          weekButtons[i].className = "active";
        }
      }

      if (homework[week].length === 0) {
        list.textContent = "No homework added yet.";
        return;
      }

      for (var i = 0; i < homework[week].length; i++) {
        var card = document.createElement("div");
        card.className = "card";

        var title = document.createElement("h3");
        title.textContent = getTitle(homework[week][i]);

        var codeButton = document.createElement("button");
        codeButton.textContent = "View Code";
        codeButton.value = i;

        codeButton.onclick = function () {
          viewCode(Number(this.value));
        };

        // Each task has its own live GitHub Pages URL once its HTML file
        // has been uploaded to this published repository.
        var siteLink = document.createElement("a");
        siteLink.className = "site-link";
        siteLink.textContent = "Open Website";
        siteLink.href = getFileURL(homework[week][i]);
        siteLink.target = "_blank";
        siteLink.rel = "noopener noreferrer";
        siteLink.setAttribute("aria-label", "Open website for " + getTitle(homework[week][i]));

        card.appendChild(title);
        card.appendChild(codeButton);
        card.appendChild(siteLink);
        list.appendChild(card);
      }
    }

    function clearPreview() {
      var preview = document.getElementById("preview");

      preview.style.display = "none";
      preview.removeAttribute("srcdoc");
      preview.src = "about:blank";
    }

    function openViewer(file) {
      viewNumber++;
      clearPreview();
      currentFile = file;

      document.getElementById("viewer").style.display = "block";

      document.getElementById("homeworkTitle").textContent =
        getTitle(file);

      document.getElementById("message").textContent = "";
      document.getElementById("codeText").textContent = "";
      document.getElementById("codeBox").style.display = "block";
      document.getElementById("previewCodeButton").disabled = true;

      // The code viewer is below the task cards; scroll to it automatically.
      document.getElementById("viewer").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function displayCode(code) {
      document.getElementById("codeText").textContent = code;
      document.getElementById("message").textContent = "";
      document.getElementById("previewCodeButton").disabled = false;
    }

    function loadCodeFrom(url) {
      return fetch(url, { cache: "no-store" }).then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.text();
      }).then(function (source) {
        // Some hosting setups return an HTML error page instead of a 404 status.
        if (/\b404\s+(Not Found|File not found)\b/i.test(source) &&
            !/function |<script|<style/i.test(source)) {
          throw new Error("404 Not Found");
        }
        return source;
      });
    }

    function viewCode(index) {
      var file = homework[currentWeek][index];
      openViewer(file);
      var thisView = viewNumber;
      var path = getFileURL(file);
      var sources;

      // Week 2–3 may still live in the original source repository.
      // Week 4–8 HTML files are in the live-site repository.
      if (currentWeek === 2 || currentWeek === 3) {
        sources = [githubURL + path, path];
      } else if (currentWeek === 4) {
        sources = [path, githubURL + path];
      } else {
        sources = [path];
      }

      document.getElementById("message").textContent = "Loading code...";

      function attempt(n) {
        if (n >= sources.length) {
          if (thisView === viewNumber) {
            document.getElementById("message").textContent =
              "HTML file not found: " + file +
              ". Upload the complete Week folder (not just index.html) " +
              "to the main branch of Web-programming-live-site.";
          }
          return;
        }

        loadCodeFrom(sources[n])
          .then(function (code) {
            if (thisView === viewNumber) {
              displayCode(code);
            }
          })
          .catch(function () {
            if (thisView === viewNumber) {
              attempt(n + 1);
            }
          });
      }

      attempt(0);
    }

    function previewCode() {
      var code = document.getElementById("codeText").textContent;

      if (code === "") {
        document.getElementById("message").textContent =
          "First, load the code using View Code.";
        return;
      }

      clearPreview();

      var preview = document.getElementById("preview");

      preview.srcdoc = code;
      preview.style.display = "block";

      document.getElementById("message").textContent =
        "Preview is shown below the code.";
    }

    function closeViewer() {
      viewNumber++;
      clearPreview();
      currentFile = "";

      document.getElementById("viewer").style.display = "none";
      document.getElementById("codeText").textContent = "";
      document.getElementById("previewCodeButton").disabled = true;
    }

    var requestedWeek = /^#week(10|[1-9])$/i.exec(window.location.hash);
    showWeek(requestedWeek ? Number(requestedWeek[1]) : 2);
  </script>
</body>
</html>
