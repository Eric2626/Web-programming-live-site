<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric's Homework</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #2563eb;
    }

    .weeks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 25px 0;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: default;
    }

    .active {
      background-color: #163274;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h3,
    #homeworkTitle {
      overflow-wrap: anywhere;
    }

    #viewer {
      display: none;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 25px;
    }

    #preview {
      display: none;
      box-sizing: border-box;
      width: 100%;
      height: 650px;
      border: 1px solid #ddd;
      margin-top: 15px;
      background-color: white;
    }

    #codeBox {
      display: none;
    }

    pre {
      background-color: #182234;
      color: white;
      padding: 15px;
      overflow: auto;
      max-height: 550px;
      line-height: 1.6;
      border-radius: 6px;
    }

    #message {
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Eric's Homework</h1>
    <p>My Web Programming Assignments</p>

    <div id="weeks" class="weeks"></div>

    <h2 id="weekTitle">Week 2</h2>
    <div id="homeworkList"></div>

    <div id="viewer">
      <h2 id="homeworkTitle"></h2>

      <button onclick="closeViewer()">Close</button>

      <p id="message" role="status"></p>

      <div id="codeBox">
        <button
          id="previewCodeButton"
          onclick="previewCode()"
          disabled>
          Preview
        </button>

        <pre><code id="codeText"></code></pre>
      </div>

      <iframe
        id="preview"
        title="Homework preview"
        sandbox="allow-scripts allow-forms allow-modals">
      </iframe>
    </div>
  </div>

  <script>
    var githubURL =
      "https://raw.githubusercontent.com/Eric2626/web-programming/main/";

    var homework = [];
    var embeddedCode = {};

    for (var i = 1; i <= 10; i++) {
      homework[i] = [];
    }

    homework[2] = [
      "week2/Task1 Convert dip soup into semanting HTML.html",
      "week2/Task2_Blog artice with header &amp;footer.html",
      "week2/Task3_Figure, figcaption&amp;time.html",
      "week2/Task4_FAQ with details & summary.html",
      "week2/Task5_Full Semantic Portfolio Page.html",
      "week2/Task6_Fix semantic errors.html",
      "week2/Task7_Quatation and amp citation page .html",
      "week2/Task8_News Article — All Semantic Elements.html"
    ];

    homework[3] = [
      "Week3/Task1_style your first heading.html",
      "Week3/Task2_2.html",
      "Week3/Task3_Color Palette Card.html",
      "Week3/Task4_Box Model Visualisation.html",
      "Week3/Task5_Fix the broken CSS.html",
      "Week3/Task6_Flexbox  Navigation Bar.html",
      "Week3/Task7_Profile card with CSS.html",
      "Week3/Task8_Full style sheet.html",
      "week3_1/Task_01_Position_the_Badge.html",
      "week3_1/Task_02_Hover_Card_with_Transition.html",
      "week3_1/Task_03_Loading_Spinner_with_keyframes.html",
      "week3_1/Task_04_CSS_Variables_Theme.html",
      "week3_1/Task_05_Fixed_Navigation_Bar.html",
      "week3_1/Task_06_Responsive_Grid_Page.html",
      "week3_1/Task_07_Complete_CSS_Advanced_Portfolio_Page.html"
    ];

    homework[4] = [
      "Week4/task1_click_counter.html",
      "Week4/task2_dark_mode_toggle.html",
      "Week4/task3_interactive_todo_list.html",
      "Week4/task4_live_search_filter.html"
    ];

    // Week 6 code is stored inside this index.html.
    homework[6] = [
      "Week6/Task1_Random_Joke_Fetcher.html"
    ];

    embeddedCode["Week6/Task1_Random_Joke_Fetcher.html"] = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 — Random Joke Fetcher</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
    }

    .card {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      color: #2563eb;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: default;
    }

    #setup {
      font-size: 20px;
      font-weight: bold;
    }

    #punchline {
      color: #166534;
      font-size: 18px;
    }

    #message {
      color: #555;
    }

    #spinner {
      width: 25px;
      height: 25px;
      border: 4px solid #ddd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 15px 0;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .favourite {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Random Joke Fetcher</h1>
      <p>Click the button to get a random joke.</p>

      <button id="loadButton" onclick="loadJoke()">
        Load Joke
      </button>

      <button id="saveButton" onclick="saveFavourite()" disabled>
        Save Favourite
      </button>

      <p id="message" role="status"></p>
      <div id="spinner" aria-hidden="true" hidden></div>

      <div aria-live="polite">
        <p id="setup"></p>
        <p id="punchline"></p>
      </div>
    </div>

    <div class="card">
      <h2>My Favourite Jokes</h2>
      <div id="favouriteList">Loading favourites...</div>
    </div>
  </div>

  <script>
    var currentJoke = null;
    var favourites = [];

    function loadJoke() {
      currentJoke = null;

      document.getElementById("message").textContent = "Loading...";
      document.getElementById("spinner").hidden = false;
      document.getElementById("loadButton").disabled = true;
      document.getElementById("saveButton").disabled = true;

      document.getElementById("setup").textContent = "";
      document.getElementById("punchline").textContent = "";

      fetch("https://official-joke-api.appspot.com/random_joke")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Could not load joke.");
          }

          return response.json();
        })
        .then(function (joke) {
          if (
            typeof joke.setup !== "string" ||
            typeof joke.punchline !== "string"
          ) {
            throw new Error("Invalid joke.");
          }

          currentJoke = joke;

          document.getElementById("setup").textContent =
            joke.setup;

          document.getElementById("punchline").textContent =
            joke.punchline;

          document.getElementById("message").textContent = "";
          document.getElementById("saveButton").disabled = false;
        })
        .catch(function () {
          document.getElementById("message").textContent =
            "Sorry, we couldn't load a joke. Please try again.";
        })
        .finally(function () {
          document.getElementById("spinner").hidden = true;
          document.getElementById("loadButton").disabled = false;
        });
    }

    function saveFavourite() {
      if (currentJoke === null) {
        return;
      }

      // Ask the main page to save to localStorage.
      window.parent.postMessage({
        type: "eric-save-favourite",
        joke: {
          setup: currentJoke.setup,
          punchline: currentJoke.punchline
        }
      }, "*");
    }

    function showFavourites() {
      var list = document.getElementById("favouriteList");
      list.innerHTML = "";

      if (favourites.length === 0) {
        list.textContent = "No favourites saved yet.";
        return;
      }

      for (var i = 0; i < favourites.length; i++) {
        var item = document.createElement("div");
        item.className = "favourite";

        var setup = document.createElement("p");
        setup.textContent = favourites[i].setup;

        var punchline = document.createElement("p");
        punchline.textContent = favourites[i].punchline;

        item.appendChild(setup);
        item.appendChild(punchline);
        list.appendChild(item);
      }
    }

    // Receive saved favourites from the main page.
    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) {
        return;
      }

      var data = event.data;

      if (!data || data.type !== "eric-favourites-result") {
        return;
      }

      favourites = data.jokes;
      showFavourites();

      if (data.message) {
        document.getElementById("message").textContent =
          data.message;
      }
    });

    window.parent.postMessage({
      type: "eric-load-favourites"
    }, "*");
  <\/script>
</body>
</html>
`;

    var currentWeek = 2;
    var currentFile = "";
    var viewNumber = 0;
    var jokePreviewActive = false;

    // Create Week 1–10 buttons.
    for (var week = 1; week <= 10; week++) {
      var button = document.createElement("button");

      button.textContent = "Week " + week;
      button.value = week;

      button.onclick = function () {
        showWeek(Number(this.value));
      };

      document.getElementById("weeks").appendChild(button);
    }

    function getTitle(file) {
      var parts = file.split("/");
      var title = parts[parts.length - 1];

      title = title.replace(".html", "");
      title = title.split("_").join(" ");
      title = title.split("&amp;").join("&");
      title = title.replace("task", "Task");

      return title;
    }

    function getFileURL(file) {
      var parts = file.split("/");

      for (var i = 0; i < parts.length; i++) {
        parts[i] = encodeURIComponent(parts[i]);
      }

      return parts.join("/");
    }

    function showWeek(week) {
      currentWeek = week;
      closeViewer();

      document.getElementById("weekTitle").textContent =
        "Week " + week;

      var list = document.getElementById("homeworkList");
      list.innerHTML = "";

      var weekButtons =
        document.getElementById("weeks").children;

      for (var i = 0; i < weekButtons.length; i++) {
        weekButtons[i].className = "";

        if (Number(weekButtons[i].value) === week) {
          weekButtons[i].className = "active";
        }
      }

      if (homework[week].length === 0) {
        list.textContent = "No homework added yet.";
        return;
      }

      for (var i = 0; i < homework[week].length; i++) {
        var card = document.createElement("div");
        card.className = "card";

        var title = document.createElement("h3");
        title.textContent = getTitle(homework[week][i]);

        var codeButton = document.createElement("button");
        codeButton.textContent = "View Code";
        codeButton.value = i;

        codeButton.onclick = function () {
          viewCode(Number(this.value));
        };

        card.appendChild(title);
        card.appendChild(codeButton);
        list.appendChild(card);
      }
    }

    function clearPreview() {
      jokePreviewActive = false;

      var preview = document.getElementById("preview");

      preview.style.display = "none";
      preview.removeAttribute("srcdoc");
      preview.src = "about:blank";
    }

    function openViewer(file) {
      viewNumber++;
      clearPreview();
      currentFile = file;

      document.getElementById("viewer").style.display = "block";

      document.getElementById("homeworkTitle").textContent =
        getTitle(file);

      document.getElementById("message").textContent = "";
      document.getElementById("codeText").textContent = "";
      document.getElementById("codeBox").style.display = "block";
      document.getElementById("previewCodeButton").disabled = true;
    }

    function displayCode(code) {
      document.getElementById("codeText").textContent = code;
      document.getElementById("message").textContent = "";
      document.getElementById("previewCodeButton").disabled = false;
    }

    function viewCode(index) {
      var file = homework[currentWeek][index];

      openViewer(file);

      // Use code stored inside this page when available.
      if (embeddedCode[file] !== undefined) {
        displayCode(embeddedCode[file]);
        return;
      }

      var thisView = viewNumber;

      document.getElementById("message").textContent =
        "Loading code...";

      fetch(githubURL + getFileURL(file))
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.text();
        })
        .then(function (code) {
          if (thisView !== viewNumber) {
            return;
          }

          displayCode(code);
        })
        .catch(function (error) {
          if (thisView !== viewNumber) {
            return;
          }

          document.getElementById("message").textContent =
            "Could not load code. Check your internet connection " +
            "and the file name on GitHub. (" + error.message + ")";
        });
    }

    function previewCode() {
      var code = document.getElementById("codeText").textContent;

      if (code === "") {
        document.getElementById("message").textContent =
          "First, load the code using View Code.";
        return;
      }

      clearPreview();

      jokePreviewActive =
        currentFile === "Week6/Task1_Random_Joke_Fetcher.html";

      var preview = document.getElementById("preview");

      preview.srcdoc = code;
      preview.style.display = "block";

      document.getElementById("message").textContent =
        "Preview is shown below the code.";
    }

    function closeViewer() {
      viewNumber++;
      clearPreview();
      currentFile = "";

      document.getElementById("viewer").style.display = "none";
      document.getElementById("codeText").textContent = "";
      document.getElementById("previewCodeButton").disabled = true;
    }

    // Favourite storage for the Week 6 preview.
    function readFavourites() {
      var saved = localStorage.getItem("ericFavouriteJokes");

      if (saved === null) {
        return [];
      }

      var jokes = JSON.parse(saved);
      var validJokes = [];

      if (!Array.isArray(jokes)) {
        return validJokes;
      }

      for (var i = 0; i < jokes.length; i++) {
        if (
          jokes[i] &&
          typeof jokes[i].setup === "string" &&
          typeof jokes[i].punchline === "string"
        ) {
          validJokes.push({
            setup: jokes[i].setup,
            punchline: jokes[i].punchline
          });
        }
      }

      return validJokes;
    }

    window.addEventListener("message", function (event) {
      var preview = document.getElementById("preview");

      // Only accept requests from the active Week 6 preview.
      if (
        !jokePreviewActive ||
        event.source !== preview.contentWindow
      ) {
        return;
      }

      var data = event.data;

      if (
        !data ||
        (
          data.type !== "eric-load-favourites" &&
          data.type !== "eric-save-favourite"
        )
      ) {
        return;
      }

      var jokes = [];
      var message = "";

      try {
        jokes = readFavourites();

        if (data.type === "eric-save-favourite") {
          var joke = data.joke;

          if (
            !joke ||
            typeof joke.setup !== "string" ||
            typeof joke.punchline !== "string"
          ) {
            return;
          }

          var alreadySaved = false;

          for (var i = 0; i < jokes.length; i++) {
            if (
              jokes[i].setup === joke.setup &&
              jokes[i].punchline === joke.punchline
            ) {
              alreadySaved = true;
            }
          }

          if (alreadySaved) {
            message = "This joke is already in your favourites.";
          } else {
            var updatedJokes = jokes.slice();

            updatedJokes.push({
              setup: joke.setup,
              punchline: joke.punchline
            });

            localStorage.setItem(
              "ericFavouriteJokes",
              JSON.stringify(updatedJokes)
            );

            jokes = updatedJokes;
            message = "Favourite saved!";
          }
        }
      } catch (error) {
        message =
          "Could not access saved favourites. Browser storage may be unavailable.";
      }

      preview.contentWindow.postMessage({
        type: "eric-favourites-result",
        jokes: jokes,
        message: message
      }, "*");
    });

    showWeek(2);
  </script>
