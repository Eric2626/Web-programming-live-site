<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub User Lookup | Eric's Homework</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f0f4f8;color:#182234;font:16px/1.55 Arial,sans-serif;padding:24px}
main{max-width:720px;margin:auto}
header{margin-bottom:16px}
a{color:#2563eb}
h2{margin:0 0 18px;font-size:22px}
h3{margin:0 0 8px;font-size:19px}
p{margin:9px 0}
.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:24px;box-shadow:0 8px 24px #1822340d;margin-bottom:16px}
.panel{background:#f0f4f8;border-radius:10px;padding:18px;margin-top:16px;overflow-wrap:anywhere}
label{display:block;font-weight:700;margin:0 0 9px}
input{font:inherit;color:inherit;width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:12px}
button{font:inherit;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;min-height:44px}
button:hover:not(:disabled){background:#1e40af}
button.secondary{background:#10b981}
button.secondary:hover:not(:disabled){background:#047857}
button:disabled{background:#94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0f766e;outline-offset:3px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>input{flex:1}
.number{color:#2563eb;font-size:58px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.muted{color:#64748b}
.status{background:#eff6ff;color:#1e40af;border-radius:8px;padding:14px;margin:16px 0}
.error{background:#fef2f2;color:#991b1b;border-radius:8px;padding:14px;margin:16px 0}
@media(max-width:480px){body{padding:14px}.card{padding:17px}.number{font-size:46px}.row>input{flex-basis:100%}}

.user-card{display:flex;align-items:flex-start;gap:16px}
.avatar{width:92px;height:92px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px #0001;object-fit:cover;flex-shrink:0}
.profile-text{flex:1;min-width:0}
.profile-text h3{overflow-wrap:anywhere}
.handle{color:#475569;margin-top:0;overflow-wrap:anywhere}
.metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.metric{background:#e2e8f0;border-radius:8px;padding:8px 12px;font-size:14px}
.metric strong{font-size:19px;color:#2563eb;display:block}
.profile-link{display:inline-block;margin-top:16px;background:#10b981;color:white;text-decoration:none;padding:10px 15px;border-radius:8px}
.profile-link:hover{background:#047857}
@media(max-width:420px){.user-card{flex-direction:column}.avatar{width:78px;height:78px}}

</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<main>
<header><a href="../index.html#week12_1">← Week 12_2</a></header>
<div id="root"><p>Loading...</p></div>
</main>
<script>
const h=React.createElement;
const {useState,useEffect}=React;

function GitHubUserLookup(){
 const [input,setInput]=useState('Eric2626');
 const [submitted,setSubmitted]=useState({username:'Eric2626',retry:0});
 const [user,setUser]=useState(null);
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState('');
 useEffect(()=>{
   const controller=new AbortController();
   async function load(){
     setLoading(true);
     setError('');
     setUser(null);
     try{
       const response=await fetch('https://api.github.com/users/'+encodeURIComponent(submitted.username),{signal:controller.signal});
       if(!response.ok)throw new Error(response.status===404?'User not found (404)':'Could not load GitHub user (HTTP '+response.status+').');
       const data=await response.json();
       if(!data || !data.login)throw new Error('No user data returned.');
       if(!controller.signal.aborted)setUser(data);
     }catch(err){
       if(err.name!=='AbortError'&&!controller.signal.aborted)setError(err.message||'Network error');
     }finally{
       if(!controller.signal.aborted)setLoading(false);
     }
   }
   load();
   return ()=>controller.abort();
 },[submitted.username,submitted.retry]);
 function search(event){
   event.preventDefault();
   const name=input.trim();
   if(!name){setError('Enter a GitHub username.');return;}
   setSubmitted(prev=>({username:name,retry:prev.retry+1}));
 }
 return h('section',{className:'card'},
   h('h2',null,'GitHub User Lookup'),
   h('form',{onSubmit:search},
     h('label',{htmlFor:'githubUsername'},'GitHub username'),
     h('div',{className:'row'},
       h('input',{id:'githubUsername',type:'text',value:input,placeholder:'Enter username',autoCapitalize:'none',autoComplete:'off',spellCheck:false,onChange:e=>setInput(e.target.value)}),
       h('button',{type:'submit'},'Search')
     )
   ),
   loading?h('p',{className:'status',role:'status'},'Loading user...'):null,
   error?h('p',{className:'error',role:'alert'},error):null,
   user&&!loading?h('div',{className:'panel'},
     h('div',{className:'user-card'},
       h('img',{className:'avatar',src:user.avatar_url,alt:'Profile picture of '+user.login,width:92,height:92}),
       h('div',{className:'profile-text'},
         h('h3',null,user.name||user.login),
         h('p',{className:'handle'},'@'+user.login),
         user.bio?h('p',null,user.bio):null,
         h('div',{className:'metrics'},
           h('div',{className:'metric'},h('strong',null,user.followers),'Followers'),
           h('div',{className:'metric'},h('strong',null,user.public_repos),'Public repos')
         ),
         h('a',{className:'profile-link',href:'https://github.com/'+encodeURIComponent(user.login),target:'_blank',rel:'noopener noreferrer'},'View GitHub Profile ↗')
       )
     )
   ):null
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(GitHubUserLookup));

</script>
</body>
</html>
