<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 6 - Random Joke Fetcher</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; color: #222; }
    .container { max-width: 650px; margin: 20px auto; }
    .card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; }
    h1 { color: #2563eb; }
    button { background: #2563eb; color: white; padding: 12px 18px; border: 0;
             border-radius: 6px; cursor: pointer; margin-right: 6px; }
    button:disabled { background: #94a3b8; cursor: default; }
    #setup { font-size: 20px; font-weight: bold; }
    #punchline { color: #166534; font-size: 18px; }
    .joke { padding: 12px 0; border-bottom: 1px solid #ddd; }
    #message { color: #555; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Random Joke Fetcher</h1>
      <p>Click the button to get a random joke.</p>
      <button id="loadButton" onclick="loadJoke()">Load Joke</button>
      <button id="saveButton" onclick="saveFavourite()" disabled>Save Favourite</button>
      <p id="message" role="status"></p>
      <p id="setup"></p>
      <p id="punchline"></p>
    </section>
    <section class="card">
      <h2>My Favourite Jokes</h2>
      <div id="favouriteList"></div>
    </section>
  </main>

  <script>
    const storageKey = "ericFavouriteJokes";
    let currentJoke = null;

    function getFavourites() {
      try {
        const data = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(data) ? data : [];
      } catch (error) {
        return [];
      }
    }

    function showFavourites() {
      const list = document.getElementById("favouriteList");
      const favourites = getFavourites();
      list.replaceChildren();
      if (favourites.length === 0) {
        list.textContent = "No favourites saved yet.";
        return;
      }
      favourites.forEach(function (joke) {
        const item = document.createElement("div");
        item.className = "joke";
        const setup = document.createElement("p");
        const punchline = document.createElement("p");
        setup.textContent = joke.setup;
        punchline.textContent = joke.punchline;
        item.append(setup, punchline);
        list.appendChild(item);
      });
    }

    async function loadJoke() {
      const loadButton = document.getElementById("loadButton");
      const saveButton = document.getElementById("saveButton");
      const message = document.getElementById("message");
      loadButton.disabled = true;
      saveButton.disabled = true;
      currentJoke = null;
      message.textContent = "Loading...";
      document.getElementById("setup").textContent = "";
      document.getElementById("punchline").textContent = "";

      try {
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        if (!response.ok) throw new Error("Network error");
        const joke = await response.json();
        if (typeof joke.setup !== "string" || typeof joke.punchline !== "string") {
          throw new Error("Invalid joke");
        }
        currentJoke = { setup: joke.setup, punchline: joke.punchline };
        document.getElementById("setup").textContent = joke.setup;
        document.getElementById("punchline").textContent = joke.punchline;
        saveButton.disabled = false;
        message.textContent = "";
      } catch (error) {
        message.textContent = "Could not load a joke. Please try again.";
      } finally {
        loadButton.disabled = false;
      }
    }

    function saveFavourite() {
      if (!currentJoke) return;
      const message = document.getElementById("message");
      const favourites = getFavourites();
      const exists = favourites.some(joke =>
        joke.setup === currentJoke.setup && joke.punchline === currentJoke.punchline);
      if (exists) {
        message.textContent = "This joke is already in your favourites.";
        return;
      }
      try {
        favourites.push(currentJoke);
        localStorage.setItem(storageKey, JSON.stringify(favourites));
        showFavourites();
        message.textContent = "Favourite saved!";
      } catch (error) {
        message.textContent = "Could not save favourites in this browser.";
      }
    }

    showFavourites();
  </script>
</body>
</html>
