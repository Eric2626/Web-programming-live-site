<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Toggle Card</title>
  <style>
    .task-title {
      font-size: 24px;
      margin-bottom: 24px;
      color: #1a56db;
    }

    body {
      font-family: system-ui;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      padding: 24px;
      border-radius: 16px;
      width: 260px;
      background: #f0f4ff;
      border: 2px solid #c8d4f0;
      text-align: center;
      transition: all 0.3s;
    }

    .card.dark {
      background: #1a2340;
      border-color: #3a4a70;
      color: white;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1a56db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      margin-top: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1 class="task-title">Dark Mode Toggle Card</h1>

  <div id="card" class="card">
    <div class="avatar">👨‍💻</div>
    <h2>Eric</h2>
    <p>Web Programming Student</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
    const card = document.querySelector('#card');
    const btn = document.querySelector('#toggle-btn');

    btn.addEventListener('click', () => {
      card.classList.toggle('dark');

      if (card.classList.contains('dark')) {
        btn.textContent = '☀️ Light Mode';
      } else {
        btn.textContent = '🌙 Dark Mode';
      }
    });
  </script>

</body>
</html>
