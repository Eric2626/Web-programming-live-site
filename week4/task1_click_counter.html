<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click Counter with Color Change</title>
  <style>
    .task-title {
      font-size: 24px;
      margin-bottom: 24px;
      color: #1a56db;
    }

    body {
      font-family: system-ui;
      padding: 24px;
      text-align: center;
    }

    .done {
      background: #16a34a !important;
    }

    #clicker {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      background: #1a56db;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #count {
      font-size: 32px;
      font-weight: bold;
      margin: 16px 0;
    }

    #message {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1 class="task-title">Click Counter with Color Change</h1>

  <button id="clicker">Click me!</button>
  <p id="count">0</p>
  <p id="message">Keep clicking...</p>

  <script>
    const btn = document.querySelector('#clicker');
    const countEl = document.querySelector('#count');
    const msg = document.querySelector('#message');

    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;

      if (count >= 5) {
        btn.classList.add('done');
        msg.textContent = '🎉 Congratulations! You clicked 5 times!';
      }
    });
  </script>

</body>
</html>
