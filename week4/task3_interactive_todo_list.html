<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive To-Do List</title>
  <style>
    .task-title {
      font-size: 24px;
      margin-bottom: 24px;
      color: #1a56db;
    }

    body {
      font-family: system-ui;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }

    h2 {
      color: #1a56db;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-btn {
      background: #1a56db;
      color: white;
    }

    #todo-list {
      list-style: none;
      padding: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: #f0f4ff;
      border-radius: 8px;
      border: 1px solid #c8d4f0;
    }

    .del-btn {
      background: #dc2626;
      color: white;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    #empty-msg {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h1 class="task-title">Interactive To-Do List</h1>

  <h2>Eric's To-Do List</h2>

  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>

  <ul id="todo-list"></ul>
  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    function updateEmpty() {
      if (list.children.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
      }
    }

    function addTask() {
      const text = input.value.trim();

      if (text === '') {
        return;
      }

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.textContent = text;

      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.className = 'del-btn';

      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);

      input.value = '';
      updateEmpty();
    }

    addBtn.addEventListener('click', addTask);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('del-btn')) {
        e.target.closest('li').remove();
        updateEmpty();
      }
    });

    updateEmpty();
  </script>

</body>
</html>
